name: Validate Convention Files

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'promotion/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          errors=0
          for f in $(find .github -name '*.yml' -o -name '*.yaml'); do
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::Invalid YAML syntax"
              errors=$((errors + 1))
            else
              echo "✓ $f"
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors YAML file(s) failed validation"
            exit 1
          fi
          echo "All YAML files valid."

      - name: Validate shell script syntax
        run: |
          errors=0
          for script in scripts/*.sh; do
            if ! bash -n "$script" 2>/dev/null; then
              echo "::error file=$script::Shell syntax error"
              errors=$((errors + 1))
            else
              echo "✓ $script"
            fi
          done
          if [[ $errors -gt 0 ]]; then
            echo "::error::$errors script(s) failed syntax check"
            exit 1
          fi
          echo "All scripts pass syntax check."

      - name: Validate shell scripts support --help
        run: |
          for script in scripts/*.sh; do
            if bash "$script" --help > /dev/null 2>&1; then
              echo "✓ $script --help"
            else
              echo "::warning file=$script::Script does not support --help flag"
            fi
          done

      - name: Validate issue templates
        run: |
          for tmpl in .github/ISSUE_TEMPLATE/*.yml; do
            [[ "$(basename "$tmpl")" == "config.yml" ]] && continue
            for field in name description body; do
              if ! python3 -c "
          import yaml, sys
          d = yaml.safe_load(open('$tmpl'))
          if '$field' not in d:
              sys.exit(1)
          " 2>/dev/null; then
                echo "::error file=$tmpl::Missing required field: $field"
                exit 1
              fi
            done
            echo "✓ $tmpl"
          done
          echo "All issue templates valid."

      - name: Validate labels.yml
        run: |
          python3 -c "
          import yaml, sys, re
          with open('.github/labels.yml') as f:
              labels = yaml.safe_load(f)
          if not isinstance(labels, list):
              print('::error::labels.yml must be a list')
              sys.exit(1)
          for label in labels:
              if 'name' not in label or 'color' not in label:
                  print(f'::error::Label missing name or color: {label}')
                  sys.exit(1)
              if not re.match(r'^[0-9a-fA-F]{6}$', str(label['color'])):
                  print(f'::error::Invalid hex color for {label[\"name\"]}: {label[\"color\"]}')
                  sys.exit(1)
          print(f'✓ {len(labels)} labels validated')
          "

      - name: Validate JSON config files
        run: |
          for f in promotion/*.json; do
            if ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              exit 1
            fi
            echo "✓ $f"
          done
          echo "All JSON config files valid."
